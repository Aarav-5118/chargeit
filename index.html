<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChargeIt</title>
<meta name="description" content="Book a home EV charger near you in Ahmedabad in two taps, or list your own charger and earn from its idle hours.">
<meta property="og:title" content="ChargeIt">
<meta property="og:description" content="Book a home EV charger near you in Ahmedabad in two taps, or list your own charger and earn from its idle hours.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#080E0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M12 7.5V5.6A2.6 2.6 0 0 1 14.6 3h2.8A2.6 2.6 0 0 1 20 5.6v1.9' fill='none' stroke='%23F1F6F2' stroke-width='2.2' stroke-linecap='round'/%3E%3Crect x='5' y='7' width='22' height='22' rx='6' fill='%23C6F43F'/%3E%3Cpath d='M17.8 10.2 11.6 18.4h4.3l-1.4 6.6 6.3-8.4h-4.3z' fill='%230A1206'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone app. Top bar (location + vehicle), one screen at a time, five tabs at the bottom.
   Look: dark and electric. Near-black green ground, dark green cards, electric lime for the one action that matters. */
:root{
  color-scheme:dark;
  --bg:#080E0B;
  --bg-2:#0C1410;
  --card:#121C16;
  --card-2:#18241D;
  --card-3:#203027;
  --line:#1F2C25;
  --line-2:#2D3E35;
  --text:#F1F6F2;
  --text-2:#ABBAB1;
  --text-3:#6F8076;
  --lime:#C6F43F;
  --lime-ink:#0A1206;
  --lime-soft:rgba(198,244,63,.12);
  --lime-line:rgba(198,244,63,.4);
  --mint:#4BE3A0;
  --amber:#FFB547;
  --amber-soft:rgba(255,181,71,.13);
  --red:#FF5D4F;
  --red-ink:#1A0402;
  --red-soft:rgba(255,93,79,.14);
  --blue:#6CB8FF;
  --blue-soft:rgba(108,184,255,.13);
  --violet:#B9A2FF;
  --violet-soft:rgba(185,162,255,.13);
  --map:#0B130F;
  --road:#17231C;
  --road-major:#243429;
  --water:#0D2530;
  --park:#0F2018;
  --scrim:rgba(0,0,0,.62);
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; background:var(--bg)}
body{height:100%; margin:0; background:var(--bg); color:var(--text); font:500 15px/1.45 var(--font); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
button,input,select,textarea,output{font:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--lime); outline-offset:2px}
h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.025em; text-wrap:balance}

/* ---------- Shell ---------- */
.app{height:100%; max-width:480px; margin:0 auto; display:flex; flex-direction:column; position:relative; overflow:hidden; overflow:clip; background:var(--bg)}
@media (min-width:520px){ .app{border-left:1px solid var(--line); border-right:1px solid var(--line)} }
.pad{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding-block:10px; background:var(--bg); border-bottom:1px solid var(--line)}
.logo{width:34px; height:34px; flex:0 0 auto; display:block}
.lg-handle{fill:none; stroke:var(--text); stroke-width:2.2; stroke-linecap:round}
.lg-body{fill:var(--lime)}
.lg-charge{fill:#8FB82A}
.lg-bolt{fill:var(--lime-ink)}
.place{flex:1; min-width:0; text-align:left; background:none; border:0; padding:0}
.place small{display:block; font-size:11.5px; color:var(--text-3); font-weight:600}
.place b{display:flex; align-items:center; gap:4px; font-size:15.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.place b svg{width:14px; height:14px; flex:0 0 auto}
.vchip{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; max-width:52%; border:1px solid var(--line-2); background:var(--card); border-radius:14px; padding:7px 10px; text-align:left}
.vchip .vc-t{display:flex; flex-direction:column; min-width:0; line-height:1.15}
.vchip .vc-t b{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vchip .vc-t small{font-size:11.5px; color:var(--text-2); font-weight:600}
.vchip svg.dd{width:13px; height:13px; color:var(--text-3); flex:0 0 auto}
.views{flex:1 1 auto; min-height:0; position:relative}
.view{position:absolute; inset:0; display:flex; flex-direction:column; min-height:0}
.scroll{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
.stack{display:flex; flex-direction:column; gap:22px; padding-block:16px 28px}

/* ---------- Battery ---------- */
.bat{position:relative; display:inline-block; flex:0 0 auto; width:24px; height:12px; border:1.6px solid var(--text-2); border-radius:3.5px; padding:1.5px; margin-right:3px}
.bat::after{content:""; position:absolute; right:-4.5px; top:2.5px; width:2.5px; height:4px; background:var(--text-2); border-radius:0 1px 1px 0}
.bat-fill{display:block; height:100%; border-radius:1.5px; background:var(--lime)}
.bat.mid .bat-fill{background:var(--amber)}
.bat.low .bat-fill{background:var(--red)}
.bbar{position:relative; height:34px; border:2px solid var(--line-2); border-radius:10px; padding:3px; margin-right:7px; background:var(--bg-2)}
.bbar::after{content:""; position:absolute; right:-7px; top:50%; width:5px; height:12px; transform:translateY(-50%); background:var(--line-2); border-radius:0 3px 3px 0}
.bb-now,.bb-add{position:absolute; top:3px; bottom:3px; border-radius:6px; transition:width .25s, left .25s}
.bb-now{left:3px; background:var(--card-3)}
.bb-add{background:var(--lime); background-image:repeating-linear-gradient(-45deg, transparent 0 7px, rgba(10,18,6,.14) 7px 14px); display:flex; align-items:center; justify-content:flex-end; padding-right:8px; overflow:hidden; font-size:12px; font-weight:800; color:var(--lime-ink); font-style:normal}
.bb-lbl{position:absolute; inset:0; display:flex; align-items:center; padding:0 12px; font-size:12px; font-weight:800; pointer-events:none; color:var(--text)}

/* ---------- Common bits ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 22px; border-radius:16px; border:0; background:var(--lime); color:var(--lime-ink); font-weight:800; font-size:15.5px; transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px; height:18px; flex:0 0 auto}
.btn.ghost{background:var(--card-2); color:var(--text); border:1px solid var(--line-2)}
.btn.red{background:var(--red); color:var(--red-ink)}
.btn.block{width:100%}
.btn.small{min-height:40px; padding:0 16px; font-size:13.5px; border-radius:12px}
.btn:disabled{background:var(--card-2); color:var(--text-3); cursor:not-allowed}
.pbtn{flex:0 0 auto; border:1px solid var(--lime-line); background:var(--lime-soft); color:var(--lime); border-radius:12px; padding:8px 14px; font-weight:800; font-size:13px}
.link{background:none; border:0; padding:0; color:var(--lime); font-weight:700; font-size:13.5px}
.link.muted{color:var(--text-2)}
.link.danger{color:var(--red)}
.iconbtn{width:40px; height:40px; flex:0 0 auto; border-radius:12px; border:1px solid var(--line-2); background:var(--card); display:grid; place-items:center; color:var(--text)}
.iconbtn svg{width:18px; height:18px}
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:1px solid var(--line-2); background:var(--card); border-radius:12px; padding:8px 13px; font-size:13px; font-weight:700; color:var(--text-2); white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.chip:disabled{opacity:.35; cursor:not-allowed}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800; border-radius:8px; padding:3px 8px; background:var(--card-3); color:var(--text-2); white-space:nowrap}
.tag svg{width:12px; height:12px}
.tag.lime{background:var(--lime-soft); color:var(--lime)}
.tag.mint{background:rgba(75,227,160,.12); color:var(--mint)}
.tag.amber{background:var(--amber-soft); color:var(--amber)}
.tag.red{background:var(--red-soft); color:var(--red)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.sec-h h2{font-size:18px}
.muted{color:var(--text-2)}
.fine{font-size:12.5px; color:var(--text-3); margin:0; font-weight:500}
.card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px}
.row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding-block:5px; font-size:14px}
.row > span:first-child{color:var(--text-2)}
.row > span:last-child{font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.row.total{border-top:1px solid var(--line-2); margin-top:6px; padding-top:11px; font-size:16px}
.row.total > span{color:var(--text); font-weight:800}
.av{width:46px; height:46px; flex:0 0 auto; border-radius:14px; background:var(--card-3); color:var(--text); display:grid; place-items:center; font-weight:800; font-size:15px}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; border-radius:10px; padding:9px 6px; font-size:13.5px; font-weight:700; color:var(--text-2); white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card-3); color:var(--text)}
.vhead{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding-block:12px; background:var(--bg)}
.vhead h1{font-size:20px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- Home ---------- */
.active{display:flex; flex-direction:column; gap:12px; border:1px solid var(--lime-line); background:linear-gradient(var(--lime-soft), var(--lime-soft)), var(--card)}
.active-top{display:flex; gap:12px; align-items:center}
.active-top .ic{width:46px; height:46px; border-radius:14px; background:var(--lime); color:var(--lime-ink); display:grid; place-items:center; flex:0 0 auto}
.active-top .ic svg{width:24px; height:24px}
.active-top b{display:block; font-size:16px; font-weight:800}
.two-btn{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.hero{display:flex; flex-direction:column; gap:14px; padding:18px; border-radius:24px; background:var(--card); border:1px solid var(--line-2); position:relative; overflow:hidden}
.hero::before{content:""; position:absolute; right:-60px; top:-60px; width:180px; height:180px; border-radius:50%; background:var(--lime-soft); pointer-events:none}
.hero-top{display:flex; justify-content:space-between; align-items:center; gap:8px; position:relative}
.hero-host{display:flex; align-items:center; gap:12px; position:relative}
.hero-host .who{flex:1; min-width:0}
.hero-host b{display:block; font-size:18px; font-weight:800; letter-spacing:-.01em}
.hero-host span{font-size:13px; color:var(--text-2)}
.price{font-size:20px; font-weight:800; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.price small{font-size:12px; color:var(--text-3); font-weight:600}
.stats3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.stat{background:var(--bg-2); border-radius:14px; padding:10px 12px; min-width:0}
.stat b{display:block; font-size:18px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--text-3); font-weight:600}
.to-row{display:flex; align-items:center; gap:10px}
.to-row > span{font-size:13px; color:var(--text-2); font-weight:600; flex:0 0 auto}
.rebook{display:flex; align-items:center; gap:12px; padding:12px 14px; width:100%; color:var(--text)}
.rebook .who{flex:1; min-width:0; display:flex; flex-direction:column}
.rebook b{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rebook .who > span{font-size:12.5px; color:var(--text-2)}
.rebook .ic{width:40px; height:40px; border-radius:12px; background:var(--card-3); display:grid; place-items:center; flex:0 0 auto}
.rebook .ic svg{width:20px; height:20px}
.tiles{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
.tile{display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:0; padding:0; font-size:12.5px; font-weight:700; color:var(--text)}
.tile .ic{width:100%; aspect-ratio:1/1; max-width:100%; border-radius:20px; display:grid; place-items:center}
.tile .ic svg{width:28px; height:28px}
.tile.t-map .ic{background:var(--lime-soft); color:var(--lime)}
.tile.t-sos .ic{background:var(--red-soft); color:var(--red)}
.tile.t-hw .ic{background:var(--amber-soft); color:var(--amber)}
.tile.t-rent .ic{background:var(--blue-soft); color:var(--blue)}
.earnban{display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--violet-soft); border:1px solid rgba(185,162,255,.25); border-radius:20px; text-align:left; width:100%; color:var(--text)}
.earnban .ic{width:44px; height:44px; border-radius:14px; background:var(--violet); color:#140F2A; display:grid; place-items:center; flex:0 0 auto}
.earnban .ic svg{width:22px; height:22px}
.earnban > svg{width:18px; height:18px; flex:0 0 auto; color:var(--text-3)}
.earnban b{display:block; font-size:15px}
.earnban span span{font-size:12.5px; color:var(--text-2)}
.list{display:flex; flex-direction:column; gap:10px; list-style:none; margin:0; padding:0}
.lc{display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; cursor:pointer; animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:calc(var(--i, 0) * 35ms)}
.lc.dim{opacity:.55}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}
.lc .who{min-width:0; display:flex; flex-direction:column; gap:2px}
.lc .who b{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lc .meta{font-size:12.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lc .st{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-3)}
.lc .st.open{color:var(--mint)}
.lc .side{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.lc .side .price{font-size:15px}
.fitl{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text)}
.fitl svg{width:12px; height:12px; color:var(--lime); flex:0 0 auto}
.fitl.no{color:var(--red)}
.empty{display:flex; flex-direction:column; align-items:flex-start; gap:10px}
.empty p{margin:0}

/* ---------- Map ---------- */
.map{position:absolute; inset:0; overflow:hidden; background:var(--map); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.map.dragging{cursor:grabbing}
#mapsvg{position:absolute; inset:0; width:100%; height:100%; display:block}
.m-ground{fill:var(--map)}
.m-park{fill:var(--park)}
.m-water{fill:var(--water)}
.m-river{fill:none; stroke:var(--water); stroke-width:.36; stroke-linecap:round; stroke-linejoin:round}
.m-road{fill:none; stroke:var(--road); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke}
.m-major{fill:none; stroke:var(--road-major); stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke}
.m-ring{fill:none; stroke:var(--road-major); stroke-width:2; vector-effect:non-scaling-stroke}
.m-runway{fill:none; stroke:var(--road-major); stroke-width:.07}
.overlay{position:absolute; inset:0; pointer-events:none}
.mlabel{position:absolute; left:0; top:0; z-index:1; font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--text-3); white-space:nowrap}
.mlabel.road{background:var(--map); padding:0 4px}
.mlabel.river{font-style:italic; font-weight:600; font-size:13px; color:#3E6A78}
.pin{position:absolute; left:0; top:0; pointer-events:auto; display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:800; line-height:1; padding:6px 9px 6px 7px; border-radius:10px; border:1px solid var(--line-2); background:var(--card-2); color:var(--text-2); white-space:nowrap; font-variant-numeric:tabular-nums; transition:background .15s, color .15s}
.pin svg{width:11px; height:11px}
.pin.open{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.pin.nofit{opacity:.45; border-style:dashed}
.pin.sel{background:var(--text); color:var(--bg); border-color:var(--text); opacity:1}
.you{position:absolute; left:0; top:0; z-index:4; width:18px; height:18px; border-radius:50%; background:var(--blue); border:3px solid var(--bg)}
.you::before{content:""; position:absolute; inset:-11px; border-radius:50%; background:var(--blue); opacity:0; animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.3); opacity:.45} 100%{transform:scale(1.2); opacity:0}}
.map-top{position:absolute; left:0; right:0; top:10px; z-index:8}
.map-top .chip:not([aria-pressed="true"]){background:var(--card)}
.mapctl{position:absolute; right:max(12px, env(safe-area-inset-right, 0px)); top:58px; z-index:8; display:flex; flex-direction:column; gap:8px}
.mapctl button{width:40px; height:40px; border-radius:12px; border:1px solid var(--line-2); background:var(--card); display:grid; place-items:center; color:var(--text)}
.mapctl svg{width:17px; height:17px}
.carousel{position:absolute; left:0; right:0; bottom:12px; z-index:8; display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.carousel::-webkit-scrollbar{display:none}
.carousel .lc{flex:0 0 84%; scroll-snap-align:center; animation:none; box-shadow:0 10px 30px rgba(0,0,0,.45)}
.carousel .lc.sel{border-color:var(--lime-line)}

/* ---------- Sheet ---------- */
.scrim{position:absolute; inset:0; z-index:20; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity .25s, visibility 0s .25s}
.scrim.open{opacity:1; visibility:visible; transition:opacity .25s}
.sheet{position:absolute; left:0; right:0; bottom:0; z-index:21; max-height:93%; display:flex; flex-direction:column; background:var(--bg-2); border-top:1px solid var(--line-2); border-top-left-radius:26px; border-top-right-radius:26px; transform:translateY(102%); visibility:hidden; transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s}
.sheet.open{transform:none; visibility:visible; transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line-2); margin:9px auto 2px; flex:0 0 auto}
.sh-head{flex:0 0 auto; display:flex; align-items:center; gap:12px; padding-block:8px 12px; touch-action:none}
.sh-head .who{flex:1; min-width:0}
.sh-head h2{font-size:20px; line-height:1.15}
.sh-head .sub{font-size:13px; color:var(--text-2)}
.sh-body{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding-block:4px 16px}
.sh-body > *{flex-shrink:0}
.sh-foot{flex:0 0 auto; padding-block:12px 14px; border-top:1px solid var(--line); background:var(--bg-2); display:flex; flex-direction:column; gap:8px}
.grp{display:flex; flex-direction:column; gap:9px}
.grp > .lbl{font-size:13px; font-weight:700; color:var(--text-2)}
.slots{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
.slot{border:1px solid var(--line-2); background:var(--card); padding:11px 0; font-size:13px; font-weight:700; border-radius:12px; font-variant-numeric:tabular-nums}
.slot:disabled{background:transparent; color:var(--text-3); border-style:dashed; cursor:not-allowed}
.slot.taken:disabled{text-decoration:line-through}
.slot[aria-pressed="true"]{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.slot.inrange,.slot.inrange:disabled{background:var(--lime-soft); color:var(--lime); border-color:transparent; border-style:solid; text-decoration:none}
.slot.peak:not(:disabled)::after{content:" \25B2"; font-size:8px; color:var(--amber)}
.fitbox{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
.fitbox > svg{width:18px; height:18px; flex:0 0 auto; margin-top:1px; color:var(--lime)}
.fitbox.no > svg{color:var(--red)}
.fitbox .vlink{margin-left:auto; flex:0 0 auto}
.specs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.spec{background:var(--card); border-radius:14px; padding:10px 12px; min-width:0}
.spec span{display:block; font-size:12px; color:var(--text-3); font-weight:600}
.spec b{display:block; font-size:14px; margin-top:2px}
.note{margin:0; border-left:3px solid var(--lime); padding:2px 0 2px 12px; font-size:14.5px; color:var(--text)}
.note span{display:block; font-size:12px; color:var(--text-3); margin-top:4px; font-weight:600}
.photos{display:flex; gap:8px; overflow-x:auto}
.photos img{width:120px; height:84px; object-fit:cover; border-radius:12px; flex:0 0 auto}
.optrow{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer}
.optrow .t{font-weight:700; font-size:14px}
.optrow .fine{display:block; margin-top:1px}
.details{border-top:1px solid var(--line); padding-top:4px}
.details summary{list-style:none; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:14px; padding-block:10px; color:var(--text-2)}
.details summary::-webkit-details-marker{display:none}
.details summary svg{width:16px; height:16px; transition:transform .2s}
.details[open] summary svg{transform:rotate(90deg)}
.details > div{display:flex; flex-direction:column; gap:12px; padding-bottom:6px}

/* Swipe to confirm */
.swipe{position:relative; height:60px; border-radius:18px; background:var(--lime); overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none; --p:0}
.swipe-fill{position:absolute; inset:0; background:rgba(10,18,6,.12); transform-origin:left; transform:scaleX(var(--p))}
.swipe-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-left:44px; color:var(--lime-ink); font-weight:800; font-size:16px; opacity:calc(1 - var(--p) * 1.3); pointer-events:none}
.swipe-knob{position:absolute; left:6px; top:6px; width:48px; height:48px; border-radius:14px; background:var(--lime-ink); color:var(--lime); display:grid; place-items:center; border:0; cursor:grab; z-index:2; transition:transform .25s cubic-bezier(.2,.8,.2,1); touch-action:none}
.swipe.drag .swipe-knob{transition:none; cursor:grabbing}
.swipe-knob svg{width:22px; height:22px}
.swipe.red{background:var(--red)}
.swipe.red .swipe-text{color:var(--red-ink)}
.swipe.red .swipe-knob{background:var(--red-ink); color:var(--red)}
.swipe:not(.drag) .swipe-knob svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,60%,100%{transform:translateX(0)} 30%{transform:translateX(4px)}}
.swipe-hint{text-align:center; font-size:12px; color:var(--text-3)}

/* Vehicle and place pickers */
.picklist{display:flex; flex-direction:column; gap:8px}
.pick{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; color:var(--text)}
.pick[aria-pressed="true"],.pick.on{border-color:var(--lime-line); background:linear-gradient(var(--lime-soft), var(--lime-soft)), var(--card)}
.pick .ic{width:40px; height:40px; border-radius:12px; background:var(--card-3); display:grid; place-items:center; flex:0 0 auto; color:var(--text-2)}
.pick[aria-pressed="true"] .ic,.pick.on .ic{background:var(--lime); color:var(--lime-ink)}
.pick .ic svg{width:20px; height:20px}
.pick .who{flex:1; min-width:0}
.pick b{display:block; font-size:14.5px}
.pick .who > span{font-size:12.5px; color:var(--text-2)}
.pick .chk{width:20px; height:20px; color:var(--lime); flex:0 0 auto}
.pctgrid{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px}
.pctgrid button{border:1px solid var(--line-2); background:var(--card); border-radius:12px; padding:11px 0; font-weight:800; font-size:14px; font-variant-numeric:tabular-nums}
.pctgrid button[aria-pressed="true"]{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.models{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
.model{text-align:left; border:1px solid var(--line); background:var(--card); border-radius:14px; padding:11px 12px; display:flex; flex-direction:column; gap:2px}
.model b{font-size:14px}
.model span{font-size:12px; color:var(--text-2)}

/* Success, session, tracking */
.okmark{width:76px; height:76px; border-radius:24px; background:var(--lime); color:var(--lime-ink); display:grid; place-items:center}
.okmark svg{width:40px; height:40px}
.okmark path{stroke-dasharray:40; stroke-dashoffset:40; animation:draw .5s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bigtitle{font-size:30px; line-height:1.05}
.sess{display:flex; flex-direction:column; align-items:center; gap:18px; padding-block:30px 10px; text-align:center}
.vbat{position:relative; width:150px; height:250px; border:4px solid var(--line-2); border-radius:30px; padding:8px; background:var(--bg-2)}
.vbat::before{content:""; position:absolute; top:-16px; left:50%; width:54px; height:12px; transform:translateX(-50%); background:var(--line-2); border-radius:6px 6px 0 0}
.vbat-fill{position:absolute; left:8px; right:8px; bottom:8px; border-radius:20px; background:var(--lime); transition:height .3s; background-image:repeating-linear-gradient(-45deg, transparent 0 9px, rgba(10,18,6,.12) 9px 18px); background-size:26px 26px; animation:flow 1s linear infinite}
@keyframes flow{to{background-position:26px 0}}
.vbat.stopped .vbat-fill{animation:none}
.vbat-pct{position:absolute; inset:0; display:grid; place-items:center; font-size:40px; font-weight:800; letter-spacing:-.03em; color:var(--text); text-shadow:0 1px 12px rgba(0,0,0,.55)}
.track{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.tstep{display:grid; grid-template-columns:28px 1fr; gap:12px; position:relative; padding-bottom:18px}
.tstep:last-child{padding-bottom:0}
.tstep::before{content:""; position:absolute; left:13px; top:26px; bottom:-2px; width:2px; background:var(--line-2)}
.tstep:last-child::before{display:none}
.tstep.done::before{background:var(--lime)}
.tdot{width:28px; height:28px; border-radius:50%; border:2px solid var(--line-2); background:var(--bg-2); display:grid; place-items:center; position:relative; z-index:1}
.tstep.done .tdot{background:var(--lime); border-color:var(--lime); color:var(--lime-ink)}
.tstep.now .tdot{border-color:var(--lime); box-shadow:0 0 0 5px var(--lime-soft)}
.tdot svg{width:14px; height:14px}
.tt{font-weight:800; font-size:14.5px}
.td{font-size:13px; color:var(--text-2)}
.tstep.todo .tt{color:var(--text-3)}
.stars{display:flex; gap:6px; justify-content:center}
.stars button{border:0; background:none; padding:2px; font-size:32px; line-height:1; color:var(--line-2)}
.stars.small button{font-size:22px}
.stars button.on{color:var(--amber)}

/* ---------- Bookings ---------- */
.bk{display:flex; flex-direction:column; gap:12px}
.bk-top{display:flex; gap:12px; align-items:center}
.bk-top .who{flex:1; min-width:0; display:flex; flex-direction:column}
.bk-top b{font-size:15px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.bk-top .who > span{font-size:12.5px; color:var(--text-2)}
.datebox{width:48px; height:52px; flex:0 0 auto; border-radius:14px; background:var(--card-3); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; font-weight:800; text-transform:uppercase; color:var(--text-2)}
.datebox b{font-size:19px; color:var(--text); line-height:1.05}
.datebox.ic.red{background:var(--red-soft); color:var(--red)}
.datebox.ic.blue{background:var(--blue-soft); color:var(--blue)}
.datebox.ic.violet{background:var(--violet-soft); color:var(--violet)}
.datebox svg{width:22px; height:22px}
.bk-act{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* ---------- Earn and forms ---------- */
.calc{display:flex; flex-direction:column; gap:14px; background:var(--card); border:1px solid var(--line-2); border-radius:24px; padding:18px}
.calc .big{font-size:38px; font-weight:800; letter-spacing:-.03em; color:var(--lime); line-height:1}
input[type="range"]{width:100%; accent-color:var(--lime); margin:4px 0}
.lblrow{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13.5px; font-weight:700; color:var(--text-2)}
.lblrow output{font-weight:800; font-size:15px; color:var(--text); font-variant-numeric:tabular-nums}
.chart{display:block; width:100%; height:auto}
.chart .bar{fill:var(--card-3); transform-box:fill-box; transform-origin:bottom; animation:grow .6s cubic-bezier(.2,.8,.2,1) backwards}
.chart .bar.top{fill:var(--lime)}
.chart text{fill:var(--text-3); font-size:10px; font-weight:700; font-family:var(--font)}
@keyframes grow{from{transform:scaleY(0)}}
.form{display:flex; flex-direction:column; gap:16px}
.field{display:flex; flex-direction:column; gap:7px; border:0; margin:0; padding:0; min-width:0}
.field > label,.flabel{font-size:13.5px; font-weight:700; color:var(--text-2)}
legend.flabel{padding:0; margin-bottom:7px}
.input{width:100%; min-width:0; border:1px solid var(--line-2); background:var(--card); border-radius:14px; padding:13px 14px; font-size:16px; color:var(--text)}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none; border-color:var(--lime)}
.input[aria-invalid="true"]{border-color:var(--red)}
select.input{appearance:none; -webkit-appearance:none; padding-right:36px}
.selwrap{position:relative}
.selwrap::after{content:""; position:absolute; right:16px; top:50%; width:7px; height:7px; border-right:2px solid var(--text-3); border-bottom:2px solid var(--text-3); transform:translateY(-70%) rotate(45deg); pointer-events:none}
textarea.input{resize:vertical; min-height:64px}
.err{font-size:12.5px; color:var(--red); font-weight:600}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--card); cursor:pointer}
.switch .t{font-weight:700; font-size:14px}
.switch .fine{display:block; margin-top:1px}
.switch input{appearance:none; -webkit-appearance:none; width:46px; height:28px; border-radius:999px; background:var(--card-3); position:relative; flex:0 0 auto; margin:0; cursor:pointer; transition:background .2s}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--text-2); transition:transform .2s, background .2s}
.switch input:checked{background:var(--lime)}
.switch input:checked::after{transform:translateX(18px); background:var(--lime-ink)}
.days{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px}
.days button{border:1px solid var(--line-2); background:var(--card); border-radius:12px; padding:10px 0; font-size:13px; font-weight:800; color:var(--text-2)}
.days button[aria-pressed="true"]{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.photo-in{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.photo-in img{width:64px; height:64px; object-fit:cover; border-radius:12px}
.filebtn{position:relative; overflow:hidden}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}
.ml{display:flex; flex-direction:column; gap:10px}
.ml .switch{border:0; padding:0; background:none}

/* ---------- Profile ---------- */
.me-head{display:flex; gap:14px; align-items:center}
.me-av{width:58px; height:58px; border-radius:18px; background:var(--lime); color:var(--lime-ink); display:grid; place-items:center}
.me-av svg{width:30px; height:30px}
.rows{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden}
.mrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border:0; border-bottom:1px solid var(--line); font-size:14.5px; width:100%; background:none; text-align:left}
.mrow:last-child{border-bottom:0}
.mrow .r{color:var(--text-2); font-size:13px; display:flex; align-items:center; gap:10px}
.plus{display:flex; flex-direction:column; gap:10px; padding:18px; border-radius:22px; background:var(--lime); color:var(--lime-ink)}
.plus h2{font-size:22px}
.plus p{margin:0; font-weight:600; font-size:13.5px; opacity:.85}
.plus .btn{background:var(--lime-ink); color:var(--lime); align-self:flex-start}

/* ---------- Tabs and toast ---------- */
.tabs{flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); background:var(--bg)}
.tab{position:relative; border:0; background:none; height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11.5px; font-weight:700; color:var(--text-3)}
.tab svg{width:23px; height:23px}
.tab[aria-current="page"]{color:var(--lime)}
.badge{position:absolute; top:8px; left:calc(50% + 6px); font-size:10px; font-weight:800; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--lime); color:var(--lime-ink); display:grid; place-items:center}
.toast{position:absolute; left:50%; bottom:80px; z-index:40; transform:translate(-50%, 16px); opacity:0; background:var(--text); color:var(--bg); padding:11px 16px; border-radius:14px; font-size:13.5px; font-weight:700; pointer-events:none; white-space:nowrap; transition:opacity .25s, transform .25s}
.toast.show{opacity:1; transform:translate(-50%, 0)}

/* ---------- Wide screens: a full website layout ---------- */
.brandwrap{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.wordmark{display:none; font-weight:800; font-size:21px; letter-spacing:-.03em}
.wordmark b{color:var(--lime); font-weight:800}
.topnav{display:none}
.bgrid{display:flex; flex-direction:column; gap:10px}
.cols{display:flex; flex-direction:column; gap:22px}
.col{display:flex; flex-direction:column; gap:22px; min-width:0}
.pin.hov{box-shadow:0 0 0 3px var(--lime-line); z-index:9 !important}
.app.wide{max-width:none; border:0}
.app.wide .top{padding-block:12px; gap:18px}
.app.wide .wordmark{display:block}
.app.wide .topnav{display:flex; flex:1; gap:4px; justify-content:center}
.app.wide .tabs{display:none}
.app.wide .place{flex:0 1 280px}
.app.wide .vchip{max-width:260px}
.topnav .tab{flex-direction:row; height:42px; padding:0 16px; border-radius:12px; font-size:14px; gap:8px}
.topnav .tab svg{width:19px; height:19px}
.topnav .tab:hover{background:var(--card); color:var(--text)}
.topnav .tab[aria-current="page"]{background:var(--lime-soft); color:var(--lime)}
.topnav .badge{position:static; margin-left:2px}
.app.wide .topnav .tab[data-v="map"]{display:none}
.app.wide #v-home{right:auto; width:460px; border-right:1px solid var(--line)}
.app.wide #v-map{left:460px}
.app.wide #v-map .carousel,.app.wide #v-map .map-top{display:none}
.app.wide .mapctl{top:16px}
.app.wide #v-home .t-map,.app.wide #v-home .see-map{display:none}
.app.wide #v-home .tiles{grid-template-columns:repeat(3, minmax(0,1fr))}
.app.wide #v-home .tile .ic{aspect-ratio:auto; height:76px}
.app.wide .scrim{display:none}
.app.wide .sheet{left:auto; top:0; width:440px; max-height:none; border-radius:0; border-top:0; border-left:1px solid var(--line-2); transform:translateX(102%); box-shadow:-20px 0 50px rgba(0,0,0,.35)}
.app.wide .sheet.open{transform:none}
.app.wide .grab{display:none}
.app.wide .sh-head{padding-top:18px}
.app.wide .wrap{max-width:1120px; margin-left:auto; margin-right:auto; width:100%}
.app.wide .narrow{max-width:640px; margin-left:auto; margin-right:auto; width:100%}
.app.wide .bgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:14px}
.app.wide .cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; align-items:start}
.app.wide #v-highway .list{display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr))}
.app.wide .toast{bottom:28px}
.app.wide .stack{padding-block:24px 36px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .okmark path{stroke-dashoffset:0}
}

/* Keep content clear of the phone's notch and home bar */
:root{padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px)}
[hidden]{display:none !important}
img{max-width:100%}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top pad" id="top">
    <div class="brandwrap"><svg class="logo" viewBox="0 0 32 32" role="img" aria-label="ChargeIt"><path class="lg-handle" d="M12 7.5V5.6A2.6 2.6 0 0 1 14.6 3h2.8A2.6 2.6 0 0 1 20 5.6v1.9"/><rect class="lg-body" x="5" y="7" width="22" height="22" rx="6"/><path class="lg-charge" d="M5 22h22v1a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6z"/><path class="lg-bolt" d="M17.8 10.2 11.6 18.4h4.3l-1.4 6.6 6.3-8.4h-4.3z"/></svg><span class="wordmark" aria-hidden="true">charge<b>it</b></span></div>
    <nav class="topnav" id="topnav" aria-label="Primary"></nav>
    <button type="button" class="place" data-act="places" id="placebtn" aria-label="Change location"></button>
    <button type="button" class="vchip" data-act="vehicle" id="vchip" aria-label="Change vehicle or battery level"></button>
  </header>

  <main class="views">
    <section class="view" id="v-home" aria-label="Home"></section>
    <section class="view" id="v-map" aria-label="Map" hidden>
      <div class="map" id="map">
        <svg id="mapsvg" aria-hidden="true" preserveAspectRatio="none"></svg>
        <div class="overlay" id="overlay"></div>
      </div>
      <div class="map-top"><div class="chips pad" id="mapchips" role="group" aria-label="Filters"></div></div>
      <div class="mapctl">
        <button type="button" data-act="zin" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button type="button" data-act="zout" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button type="button" data-act="zfit" aria-label="Show all chargers"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="carousel" id="carousel"></div>
    </section>
    <section class="view" id="v-bookings" aria-label="Bookings" hidden></section>
    <section class="view" id="v-earn" aria-label="Earn" hidden></section>
    <section class="view" id="v-profile" aria-label="Profile" hidden></section>
    <section class="view" id="v-highway" aria-label="Highway stops" hidden></section>
    <section class="view" id="v-session" aria-label="Charging session" hidden></section>
    <section class="view" id="v-track" aria-label="Rescue status" hidden></section>
    <section class="view" id="v-list" aria-label="List your charger" hidden>
      <div class="vhead pad narrow"><button type="button" class="iconbtn" data-act="tab" data-v="earn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button><h1>List your charger</h1></div>
      <div class="scroll"><form class="form pad narrow" id="hostform" novalidate style="padding-block:8px 28px">
        <div class="field"><label for="h-name">Your name</label><input class="input" id="h-name" autocomplete="name" placeholder="e.g. Hetal Shah"><div class="err" id="e-name" hidden></div></div>
        <div class="field"><label for="h-address">Address or landmark</label><input class="input" id="h-address" placeholder="e.g. B-12, near Shyamal Cross Road"><div class="err" id="e-address" hidden></div></div>
        <div class="field"><label for="h-area">Area</label><div class="selwrap"><select class="input" id="h-area"></select></div><div class="err" id="e-area" hidden></div></div>
        <fieldset class="field"><legend class="flabel">Charger type</legend><div class="chips" id="h-kind" role="group" aria-label="Charger type"></div></fieldset>

function compat(c, v){
  if (v.type === "car"){
    if (c.kind === "socket") return { ok:true, kw:Math.min(v.ac, 3.3), note:"Use the portable charger that came with your car." };

    const slower = v.ac < kwOf(c) ? " Your car takes up to " + fmtKw(v.ac) + ", so that's your speed." : "";
    if (c.cable) return { ok:true, kw:k, note:"Fits your car. Cable is attached." + slower };
    if (c.cableRent) return { ok:true, kw:k, rentable:true, note:"Fits your car. Rent the host's cable for ₹" + CABLE_RENT + "." + slower };
    return { ok:true, kw:k, needCable:true, note:"Fits, but bring your own Type 2 cable." + slower };
  }
  if (c.kind === "socket" || c.socket2w) return { ok:true, kw:v.ac, note:"Fits. Plug your own charger into the 3-pin socket." };
  return { ok:false, kw:0, note:"No 3-pin socket here, so your " + TYPE_LABEL[v.type].toLowerCase() + " can't charge." };
}

const peakAt = (c, h) => c.peak && h >= 18 && h < 22;

function visible(c){
  if (!onMap(c)) return false;
  const v = veh();
  if (S.filters.has("fits") && !compat(c, v).ok) return false;
  if (S.filters.has("open") && !status(c).open) return false;
  if (S.filters.has("cable") && !c.cable) return false;
  if (S.filters.has("fast") && kwOf(c) < 7) return false;
  if (S.filters.has("cheap") && priceFor(c, v) >= 100) return false;
  return true;
}
function bestCharger(){
  const v = veh(), to = targetFor(); let best = null;

    const score = Math.max(0, waitHours(s)) * 1.6 + distKm(c.lat, c.lng);
    if (!best || score < best.score) best = { c, p, s, score };
  }

function bookTotal(c, v, start, dur, cable){ let t = 0; for (let h = start; h < start + dur; h++) t += hourPrice(c, v, h); return t + (cable ? CABLE_RENT : 0); }
function swipeHTML(label, cls){

}
function bindSwipe(el, onDone){
  const knob = el.querySelector(".swipe-knob"); let st = null, fired = false;
  const max = () => el.clientWidth - knob.offsetWidth - 12;
  const finish = () => { if (fired) return; fired = true; knob.style.transform = "translateX(" + max() + "px)"; el.style.setProperty("--p", 1); setTimeout(onDone, 160); };
  knob.addEventListener("pointerdown", e => { st = { x:e.clientX, dx:0, id:e.pointerId }; try { knob.setPointerCapture(e.pointerId); } catch(err){} el.classList.add("drag"); });
  knob.addEventListener("pointermove", e => { if (!st || e.pointerId !== st.id) return; st.dx = Math.max(0, Math.min(max(), e.clientX - st.x)); knob.style.transform = "translateX(" + st.dx + "px)"; el.style.setProperty("--p", (st.dx / max()).toFixed(3)); });
  const end = e => { if (!st || e.pointerId !== st.id) return; el.classList.remove("drag"); if (st.dx > max() * 0.8) finish(); else { knob.style.transform = ""; el.style.setProperty("--p", 0); } st = null; };
  knob.addEventListener("pointerup", end); knob.addEventListener("pointercancel", end);
  knob.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); finish(); } });
}

let sessTimer = null;
function startSession(code){
  const b = S.bookings.find(x => x.code === code); if (!b) return;
  const c = byId(b.chargerId); if (!c) return;
  const v = VEHICLES.find(x => x.id === b.vid) || veh(), cp = compat(c, v);
  const to = Math.max(b.to || targetFor(), Math.min(100, pct() + 5));
  S.session = { code, cid:c.id, from:pct(), pct:pct(), to, kw:cp.kw || 3, price:priceFor(c, v), maxH:b.dur, kwh:v.kwh, type:v.type, done:false, rating:0 };
  clearInterval(sessTimer); sessTimer = setInterval(tickSession, 350);
  go("session");
}
function tickSession(){
  const s = S.session; if (!s || s.done) return clearInterval(sessTimer);
  s.pct = Math.min(s.to, s.pct + 1);
  const hrs = (s.pct - s.from) / 100 * s.kwh / (s.kw * 0.9);
  if (s.pct >= s.to || hrs >= s.maxH) endSession(); else if (S.view === "session") paintSession();
}
function sessNums(s){
  const kwh = (s.pct - s.from) / 100 * s.kwh, hrs = kwh / (s.kw * 0.9);
  return { kwh, hrs, km:Math.round(kwh * KM_PER_KWH[s.type]), cost:s.price * Math.min(s.maxH, Math.max(1, Math.ceil(hrs - 0.05))) };
}
function endSession(){
  const s = S.session; if (!s || s.done) return; s.done = true; clearInterval(sessTimer);
  const n = sessNums(s), b = S.bookings.find(x => x.code === s.code);
  if (b){ b.ended = true; b.total = n.cost; b.km = n.km; store.set(K.book, S.bookings); }
  setPct(s.pct); renderTop(); updateBadge();
  if (S.view === "session") renderSession();
}
function renderSession(){

  $("#v-session").innerHTML = '<div class="vhead pad narrow"><button type="button" class="iconbtn" data-act="tab" data-v="home" aria-label="Back">' + ico("back", 2.2) + '</button><h1>' + (s.done ? 'Charging done' : 'Charging at ' + esc(hostShort(c)) + '’s') + '</h1></div>' +

    h += '<div class="grp"><div class="sec-h"><h2>Your listings</h2></div>' + S.listings.map(c => '<div class="card ml"><div class="bk-top"><div class="av">' + esc(initials(c.host)) + '</div><div class="who"><b>' + esc(c.address) + '</b><span>' + esc(c.area) + ' · ' + chargerLabel(c) + ' · ' + rupee(c.price) + '/hr</span></div><span class="tag ' + (c.paused ? '' : 'mint') + '">' + (c.paused ? 'Paused' : 'Live') + '</span></div>' +
      '<label class="switch" for="lp-' + c.id + '"><span class="t">Taking bookings</span><input type="checkbox" id="lp-' + c.id + '" data-lsw="paused" data-id="' + c.id + '"' + (c.paused ? '' : ' checked') + '></label>' +

  }
  h += '<div class="grp"><div class="sec-h"><h2>A typical week</h2><span class="tag">Illustrative</span></div><div class="card">' + chartSVG(SAMPLE_WEEK) + '<p class="fine" style="margin-top:6px">Rupees per day for a 7.4 kW host, after the 10% fee. Weekends are busiest.</p></div></div>';
  h += '<div class="grp"><div class="sec-h"><h2>No charger yet?</h2></div><div class="card" style="display:flex;flex-direction:column;gap:12px">' +
    '<div class="chips">' + Object.keys(KINDS).map(k => '<button type="button" class="chip" data-act="ikind" data-v="' + k + '" aria-pressed="' + (S.inst.kind === k) + '">' + KINDS[k].label + '</button>').join("") + '</div>' +
    '<div><span class="muted" style="font-weight:700">Installed for about</span><div style="font-size:24px;font-weight:800">' + rupee(ins.lo + 3750) + ' to ' + rupee(ins.hi + 3750) + '</div><p class="fine">Includes about 15 m of wiring.' + (S.inst.kind === "t11" ? ' Needs a three-phase connection.' : '') + ' Illustrative prices.</p></div>' +
    '<button type="button" class="btn ghost block" data-act="instbook">' + ico("wrench") + 'Get a free callback</button></div></div>';
  h += '</div></div></div></div>';
  const prev = $("#earnscroll"), keepS = prev ? prev.scrollTop : 0;
  $("#v-earn").innerHTML = h; $("#earnscroll").scrollTop = keepS;
  $("#e-price").addEventListener("input", ev => {
    S.earn.price = +ev.target.value; const k2 = S.earn.price - Math.round(S.earn.price * FEE) - Math.round(KINDS[S.earn.kind].kw * UNIT);
    $("#e-price-o").textContent = rupee(S.earn.price); $("#earn-big").textContent = rupee(earnMonthly(S.earn.kind, S.earn.price, S.earn.hrs)); $("#earn-fine").textContent = earnFine(S.earn, k2);
  });

/* ---------- Listing form ---------- */
let pendingPhotos = [];
function initHostForm(){
  $("#h-area").innerHTML = '<option value="">Choose your area</option>' + Object.keys(AREAS).map(a => '<option>' + a + '</option>').join("");
  let o = "", cl = "";
  for (let h = 0; h < 24; h++) o += '<option value="' + h + '"' + (h === 9 ? ' selected' : '') + '>Opens ' + hLabel(h) + '</option>';
  for (let h = 1; h <= 24; h++) cl += '<option value="' + h + '"' + (h === 18 ? ' selected' : '') + '>Closes ' + hLabel(h) + '</option>';
  $("#h-open").innerHTML = o; $("#h-close").innerHTML = cl;
  const form = $("#hostform");
  form.addEventListener("input", ev => { updateForm(); clearErr(ev.target); });
  form.addEventListener("change", ev => { updateForm(); clearErr(ev.target); });
  form.addEventListener("submit", ev => { ev.preventDefault(); publishListing(); });
  $("#h-photos").addEventListener("change", ev => { pendingPhotos = [...ev.target.files].slice(0, 4).map(f => URL.createObjectURL(f)); renderPhotoPrev(); });
}
function renderPhotoPrev(){ const w = $("#h-photo-prev"); w.querySelectorAll("img").forEach(i => i.remove()); pendingPhotos.forEach(u => { const im = document.createElement("img"); im.src = u; im.alt = "Selected photo"; w.insertBefore(im, w.firstChild); }); }
function renderListForm(){
  if (!$("#h-name").value && !$("#h-address").value){ S.hostKind = S.earn.kind; $("#h-price").value = S.earn.price; }
  $("#h-kind").innerHTML = Object.keys(KINDS).map(k => '<button type="button" class="chip" data-act="hkind" data-v="' + k + '" aria-pressed="' + (S.hostKind === k) + '">' + KINDS[k].label + '</button>').join("");
  $("#h-days").innerHTML = [1,2,3,4,5,6,0].map(d => '<button type="button" data-act="hday" data-v="' + d + '" aria-pressed="' + S.hostDays.has(d) + '" aria-label="' + DAY_LONG[d] + '">' + DAY_SHORT[d].slice(0, 1) + '</button>').join("");
  updateForm();
}
function updateForm(){
  const socket = S.hostKind === "socket";
  $("#w-cable").hidden = socket; $("#w-s2w").hidden = socket;
  $("#w-rentcable").hidden = socket || $("#h-cable").checked;
  $("#w-p2w").hidden = !(socket || $("#h-s2w").checked);
  const price = +$("#h-price").value, kw = KINDS[S.hostKind].kw, keep = price - Math.round(price * FEE) - Math.round(kw * UNIT);
  $("#o-price").textContent = rupee(price); $("#o-p2w").textContent = rupee(+$("#h-p2w").value);
  const sg = { socket:[50,80], t7:[100,140], t11:[150,200] }[S.hostKind];
  $("#h-suggest").textContent = "Suggested for a " + KINDS[S.hostKind].label + ": ₹" + sg[0] + " to ₹" + sg[1] + " an hour.";
  $("#h-est").innerHTML = '<span class="muted" style="font-weight:700">At 2 booked hours a day</span><div style="font-size:28px;font-weight:800;color:var(--lime)">' + rupee(Math.max(0, keep) * 60) + ' <span style="font-size:14px;color:var(--text-2)">a month</span></div><p class="fine">' + (keep > 0 ? 'You keep ' + rupee(keep) + ' per hour after the 10% fee and electricity.' : 'At this price you lose money on electricity.') + '</p>';
}
function setErr(key, id, msg){ const e = $("#e-" + key); e.textContent = msg; e.hidden = false; if (id) $("#" + id).setAttribute("aria-invalid", "true"); }
function clearErr(el){ if (!el || !el.id) return; el.removeAttribute("aria-invalid"); const m = { "h-name":"name", "h-address":"address", "h-area":"area", "h-open":"hours", "h-close":"hours" }; if (m[el.id]) $("#e-" + m[el.id]).hidden = true; }
function publishListing(){
  const name = $("#h-name").value.trim(), address = $("#h-address").value.trim(), area = $("#h-area").value, open = +$("#h-open").value, close = +$("#h-close").value;
  ["name","address","area","hours","days"].forEach(k => $("#e-" + k).hidden = true);
  let first = null;
  if (!name){ setErr("name", "h-name", "Add your name so drivers know who they are meeting."); first = first || "h-name"; }
  if (!address){ setErr("address", "h-address", "Add an address or a landmark nearby."); first = first || "h-address"; }
  if (!area){ setErr("area", "h-area", "Choose your area so we can place your pin."); first = first || "h-area"; }
  if (!S.hostDays.size) setErr("days", null, "Pick at least one day.");
  if (close <= open){ setErr("hours", "h-close", "Closing time has to be after opening time."); first = first || "h-close"; }
  if (first || !S.hostDays.size){ if (first) $("#" + first).focus(); return; }
  const socket = S.hostKind === "socket", [alat, alng] = AREAS[area], j = () => (Math.random() - 0.5) * 0.008;
  const c = { id:"u" + Date.now().toString(36), host:name, area, address, lat:alat + j(), lng:alng + j(), kind:S.hostKind,
    cable:!socket && $("#h-cable").checked, cableRent:!socket && !$("#h-cable").checked && $("#h-rentcable").checked,
    socket2w:socket || $("#h-s2w").checked, price:+$("#h-price").value, price2w:(socket || $("#h-s2w").checked) ? +$("#h-p2w").value : null,
    open, close, days:[...S.hostDays].sort(), peak:$("#h-peak").checked, rating:null, sessions:0, note:$("#h-note").value.trim(), mine:true, paused:false };
  if (pendingPhotos.length) photos[c.id] = pendingPhotos.slice();
  pendingPhotos = []; renderPhotoPrev();
  S.listings.push(c); store.set(K.list, S.listings); buildPins();
  $("#hostform").reset(); S.hostDays = new Set(ALL_DAYS);
  go("earn"); toast("Your charger is live on the map");
}

    '<div class="cols"><div class="col"><div class="grp"><div class="sec-h"><h2>My vehicles</h2><button type="button" class="link" data-act="addveh">+ Add</button></div><div class="picklist">' +
      S.garage.list.map((g, i) => { const v = VEHICLES.find(x => x.id === g.id); if (!v) return ""; const on = i === S.garage.active;

          (on ? '<span class="tag lime">In use</span>' : '<button type="button" class="pbtn" data-act="setveh" data-v="' + i + '">Use</button>') +

    '</div></div>' +
    '<div class="grp"><div class="sec-h"><h2>Saved places</h2></div><div class="picklist">' + Object.keys(PLACES).map(k => { const P = PLACES[k]; return '<button type="button" class="pick" data-act="setplace" data-v="' + k + '" aria-pressed="' + (S.prefs.place === k) + '"><span class="ic">' + ico(P.icon) + '</span><span class="who"><b>' + P.name + '</b><span>' + esc(P.short + ", " + P.sub) + '</span></span>' + (S.prefs.place === k ? chkSvg : '') + '</button>'; }).join("") + '</div></div>' +
    '</div><div class="col"><div class="grp"><div class="sec-h"><h2>Pay with</h2></div><div class="seg" role="group" aria-label="Default payment">' + [["upi","UPI"],["card","Card"],["wallet","Wallet"]].map(([k, l]) => '<button type="button" data-act="setpay" data-v="' + k + '" aria-pressed="' + (S.prefs.pay === k) + '">' + l + '</button>').join("") + '</div></div>' +
    '<div class="plus"><span style="font-weight:800;font-size:12.5px;opacity:.75">ChargeIt Plus · ₹149 a month · illustrative</span><h2>' + (S.prefs.plus ? 'You’re on the waitlist' : 'Charge more, pay less') + '</h2><p>5% off every booking, free cable rentals and one free rescue every three months.</p><button type="button" class="btn small" data-act="plus">' + (S.prefs.plus ? 'Leave waitlist' : 'Join the waitlist') + '</button></div>' +
    '<div class="rows"><div class="mrow"><span>Language</span><span class="r">English · Gujarati and Hindi soon</span></div><div class="mrow"><span>ID check for hosts and drivers</span><span class="tag">Soon</span></div><div class="mrow"><span>Share live trip with family</span><span class="tag">Soon</span></div>' +
      '<div class="mrow" id="resetwrap"><span>Demo data on this device</span><button type="button" class="link danger" data-act="reset">Reset</button></div></div>' +

  '</div></div></div></div>';

/* =========================================================
   16. NAVIGATION AND TAPS
   ========================================================= */
const TABS = [["home","Home","bolt"],["map","Map","map"],["bookings","Bookings","cal"],["earn","Earn","rupee"],["profile","Profile","user"]];
const PARENT = { highway:"home", track:"home", session:"bookings", list:"earn" };
const RENDER = { home:renderHome, map:renderMapTab, bookings:renderBookings, earn:renderEarn, profile:renderProfile, highway:renderHighway, track:renderTrack, session:renderSession, list:renderListForm };
function renderTabs(){
  const html = TABS.map(([k, l, i]) => '<button type="button" class="tab" data-act="tab" data-v="' + k + '" aria-current="' + (S.tab === k ? "page" : "false") + '">' + ico(i, 1.9) + l + (k === "bookings" ? '<span class="badge" hidden></span>' : '') + '</button>').join("");
  $("#tabs").innerHTML = html; $("#topnav").innerHTML = html;
}
function go(v){
  closeSheet(); $("#app").scrollTop = 0;
  if (v === "map" && wide()) v = "home";
  S.view = v; S.tab = TABS.some(t => t[0] === v) ? v : (PARENT[v] || S.tab);
  const split = wide() && v === "home";
  document.querySelectorAll(".view").forEach(el => el.hidden = !(el.id === "v-" + v || (split && el.id === "v-map")));
  const sub = !TABS.some(t => t[0] === v);
  $("#tabs").hidden = sub; $("#top").hidden = !wide() && sub && v !== "highway";
  renderTabs(); RENDER[v](); if (split) refreshPins(); updateBadge();
}
function refreshView(){ renderTop(); RENDER[S.view](); if (S.view !== "map") refreshPins(); }
function updateBadge(){ const n = S.bookings.filter(isUp).length; document.querySelectorAll(".badge").forEach(b => { b.textContent = n; b.hidden = n === 0; }); }

function onTap(e){
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const act = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  switch (act){
    case "close": closeSheet(); break;
    case "places": openPlaces(); break;
    case "setplace": S.prefs.place = v; savePrefs(); moveYou(); closeSheet(); refreshView(); toast("Showing chargers near " + place().short); break;
    case "vehicle": openVehicle(); break;
    case "setveh": S.garage.active = +v; saveGarage(); closeSheet(); refreshView(); toast("Switched to " + veh().model); break;
    case "setpct": setPct(+v); closeSheet(); refreshView(); toast("Battery set to " + v + "%"); break;
    case "addveh": openAddVehicle("car"); break;
    case "addtype": openAddVehicle(v); break;
    case "pickmodel": {
      const i = S.garage.list.findIndex(g => g.id === v);
      if (i >= 0) S.garage.active = i; else { S.garage.list.push({ id:v, pct:30 }); S.garage.active = S.garage.list.length - 1; }
      saveGarage(); closeSheet(); refreshView(); toast(VEHICLES.find(x => x.id === v).model + " added and selected"); break;
    }
    case "delveh": { const i = +v, wasActive = S.garage.active; S.garage.list.splice(i, 1); S.garage.active = wasActive === i ? 0 : wasActive > i ? wasActive - 1 : wasActive; saveGarage(); refreshView(); break; }
    case "target": S.prefs.target = +v; savePrefs(); renderHome(); break;
    case "qb": openQB(id, v); break;
    case "mapcard": openQB(id); break;
    case "qbto": S.qb.to = +v; S.qb.start = null; renderQB(); break;
    case "qbslot": { const [d, hh] = v.split(":").map(Number); S.qb.start = { day:d, h:hh, now:d === 0 && hh === Math.floor(nowH()) }; if (!t.classList.contains("slot")) S.qb.pick = false; renderQB(); break; }
    case "qbpick": S.qb.pick = !S.qb.pick; if (S.qb.start) S.qb.day = S.qb.start.day; renderQB(); break;
    case "qbday": S.qb.day = +v; renderQB(); break;
    case "qbpay": S.qb.pay = v; renderQB(); break;
    case "tab": go(v); break;
    case "go": go(v); break;
    case "rescue": openRescue(); break;
    case "rent": openRent(); break;
    case "filter": S.filters.has(v) ? S.filters.delete(v) : S.filters.add(v); RENDER[S.view](); refreshPins(); break;
    case "clearfilters": S.filters.clear(); RENDER[S.view](); refreshPins(); break;
    case "zin": zoomAt(1.5, M.W / 2, M.H / 2); break;
    case "zout": zoomAt(1 / 1.5, M.W / 2, M.H / 2); break;
    case "zfit": fitAll(true); break;
    case "hw": S.hw = v; renderHighway(); break;
    case "rskwh": S.rescue.kwh = +v; openRescue(); break;
    case "rscancel": { clearInterval(trackTimer); const b = S.bookings.find(x => x.code === S.track.code); if (b){ b.status = "cancelled"; b.total = 0; store.set(K.book, S.bookings); } S.track = null; go("home"); toast("Rescue cancelled"); break; }
    case "rentitem": S.rent.item = v; openRent(); break;
    case "rentdays": S.rent.days = +v; openRent(); break;
    case "rentdrop": S.rent.drop = v === "1"; openRent(); break;
    case "startsess": startSession(v); break;
    case "sessstop": endSession(); break;
    case "sessrate": { const s = S.session; s.rating = +v; const b = S.bookings.find(x => x.code === s.code); if (b){ b.rating = +v; store.set(K.book, S.bookings); } renderSession(); break; }
    case "sessdone": S.session = null; go("home"); break;
    case "rate": { const b = S.bookings.find(x => x.code === v); if (b){ b.rating = +id; store.set(K.book, S.bookings); } renderBookings(); toast("Thanks for rating"); break; }
    case "cancelask": t.parentElement.innerHTML = '<span class="fine" style="color:var(--text)">Cancel this booking?</span><button type="button" class="btn small red" data-act="cancelyes" data-v="' + esc(v) + '">Yes, cancel</button><button type="button" class="link muted" data-act="cancelno">Keep it</button>'; break;
    case "cancelyes": S.bookings = S.bookings.filter(b => b.code !== v); store.set(K.book, S.bookings); renderBookings(); updateBadge(); toast("Booking cancelled. Full refund."); break;
    case "cancelno": renderBookings(); break;
    case "ekind": S.earn.kind = v; S.earn.price = { socket:60, t7:120, t11:160 }[v]; renderEarn(); break;
    case "ehrs": S.earn.hrs = +v; renderEarn(); break;
    case "ikind": S.inst.kind = v; renderEarn(); break;
    case "instbook": { const ins = INSTALL[S.inst.kind]; S.bookings.push({ kind:"install", code:mkCode("INS"), label:KINDS[S.inst.kind].label, lo:ins.lo + 3750, hi:ins.hi + 3750, made:Date.now() }); store.set(K.book, S.bookings); updateBadge(); toast("Done. An electrician will call you within a day."); break; }
    case "hkind": S.hostKind = v; $("#h-price").value = { socket:60, t7:120, t11:160 }[v]; $("#h-kind").innerHTML = Object.keys(KINDS).map(k => '<button type="button" class="chip" data-act="hkind" data-v="' + k + '" aria-pressed="' + (S.hostKind === k) + '">' + KINDS[k].label + '</button>').join(""); updateForm(); break;
    case "hday": S.hostDays.has(+v) ? S.hostDays.delete(+v) : S.hostDays.add(+v); t.setAttribute("aria-pressed", S.hostDays.has(+v)); break;
    case "showmine": { S.filters.clear(); go("map"); requestAnimationFrame(() => requestAnimationFrame(() => { measure(); if (wide()) openQB(id); else selectOnMap(id); })); break; }
    case "removeask": t.parentElement.innerHTML = '<span class="fine" style="color:var(--text)">Remove this listing?</span><button type="button" class="btn small red" data-act="removeyes" data-id="' + esc(id) + '">Remove</button><button type="button" class="link muted" data-act="removeno">Keep</button>'; break;
    case "removeyes": S.listings = S.listings.filter(c => c.id !== id); store.set(K.list, S.listings); buildPins(); renderEarn(); toast("Listing removed"); break;
    case "removeno": renderEarn(); break;
    case "setpay": S.prefs.pay = v; savePrefs(); renderProfile(); break;
    case "plus": S.prefs.plus = !S.prefs.plus; savePrefs(); renderProfile(); toast(S.prefs.plus ? "You’re on the waitlist" : "Left the waitlist"); break;
    case "reset": $("#resetwrap").innerHTML = '<span>Delete your test bookings and listings?</span><span class="r"><button type="button" class="link danger" data-act="resetyes">Yes</button><button type="button" class="link muted" data-act="resetno">No</button></span>'; break;
    case "resetyes": clearInterval(trackTimer); clearInterval(sessTimer); S.track = null; S.session = null; S.listings = []; S.bookings = []; store.set(K.list, []); store.set(K.book, []); buildPins(); renderProfile(); updateBadge(); toast("Demo data cleared"); break;
    case "resetno": renderProfile(); break;
  }
}

/* =========================================================
   17. START
   ========================================================= */
function init(){
  M.el = $("#map"); M.svg = $("#mapsvg"); M.ov = $("#overlay");
  buildBase(); buildPins(); initMapInput(); initHostForm();
  $("#app").addEventListener("click", onTap);
  $("#app").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches('.lc[role="button"]')){ e.preventDefault(); e.target.click(); } });
  $("#scrim").addEventListener("click", closeSheet);
  $("#v-earn").addEventListener("change", e => {
    const sw = e.target.closest("[data-lsw]"); if (!sw) return;
    const c = S.listings.find(x => x.id === sw.dataset.id); if (!c) return;
    if (sw.dataset.lsw === "paused") c.paused = !sw.checked; else c.peak = sw.checked;
    store.set(K.list, S.listings); buildPins(); renderEarn(); toast(sw.dataset.lsw === "paused" ? (c.paused ? "Listing paused" : "Listing is live") : (c.peak ? "Peak pricing on" : "Peak pricing off"));
  });
  let sd = null; const sh = sheet();
  sh.addEventListener("pointerdown", e => { if (wide() || !e.target.closest(".grab, .sh-head") || e.target.closest("button")) return; sd = { y:e.clientY, dy:0, id:e.pointerId }; sh.setPointerCapture(e.pointerId); sh.style.transition = "none"; });
  sh.addEventListener("pointermove", e => { if (!sd || e.pointerId !== sd.id) return; sd.dy = Math.max(0, e.clientY - sd.y); sh.style.transform = "translateY(" + sd.dy + "px)"; });
  const sdEnd = e => { if (!sd || e.pointerId !== sd.id) return; sh.style.transition = ""; sh.style.transform = ""; if (sd.dy > 80) closeSheet(); sd = null; };
  sh.addEventListener("pointerup", sdEnd); sh.addEventListener("pointercancel", sdEnd);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && sh.classList.contains("open")) closeSheet(); });
  setInterval(() => { if (S.view === "home" && !sheet().classList.contains("open")) renderHome(); updateBadge(); }, 60000);
  const applyLayout = () => $("#app").classList.toggle("wide", wide());
  applyLayout();
  if (MQ){ const onMQ = () => { applyLayout(); M.fitted = false; go(S.view); }; if (MQ.addEventListener) MQ.addEventListener("change", onMQ); else if (MQ.addListener) MQ.addListener(onMQ); }
  $("#v-home").addEventListener("mouseover", e => { const lc = e.target.closest(".lc"); hoverPin(lc ? lc.dataset.id : null); });
  $("#v-home").addEventListener("mouseleave", () => hoverPin(null));
  renderTop(); go("home");
}
init();
